<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramjet - unlock</title>
<meta name="description" content="Ramjet: a fast web proxy by GoatTech.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/ramjet.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0b0c0e">
<link rel="stylesheet" href="/style.css">
<style>
	#rj-err { color: var(--err); font-size: 13px; text-align: center; margin: 14px 22px 0; min-height: 1.4em; }
</style>
</head>
<body>

<header id="rj-chrome">
	<img src="/assets/ramjet.svg" alt="" class="mark">
	<span class="byline">goattech</span>
</header>

<main id="rj-landing">
	<h1 class="wordmark-big">ram<em>jet</em></h1>
	<p class="tag">crew only. what's the password?</p>
</main>

<form id="rj-form" method="post" action="/auth/login" autocomplete="off">
	<span class="prefix">//</span>
	<input id="rj-address" type="password" name="password" placeholder="password" aria-label="Password" required>
	<button type="submit" class="ignite">unlock&nbsp;&#8594;</button>
</form>

<p id="rj-err" role="alert"></p>

<footer id="rj-foot">
	<span id="rj-status" data-mode="idle">gate armed</span>
	<span class="ver">v0.2.0</span>
</footer>

<script>
	const q = new URLSearchParams(location.search);
	const err = document.getElementById("rj-err");
	if (q.has("bad")) err.textContent = "wrong password. try again.";
	if (q.has("locked")) err.textContent = "too many tries - gate's locked for 15 minutes.";
	document.getElementById("rj-address").focus();
</script>

</body>
</html>
