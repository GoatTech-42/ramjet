<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramjet - sign in</title>
<meta name="description" content="Ramjet: a fast web proxy by GoatTech.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/ramjet.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0b0c0e">
<link rel="stylesheet" href="/style.css?v=22">
<style>
	#rj-err { color: var(--err); font-size: 13px; text-align: center; margin: 14px 22px 0; min-height: 1.4em; }
	#rj-user {
		flex: 0 0 34%;
		min-width: 0;
		border: 0;
		outline: 0;
		background: transparent;
		color: var(--text);
		font-family: var(--mono);
		font-size: 15px;
		padding: 15px 12px;
		border-right: 1px solid var(--edge);
	}
	#rj-user::placeholder { color: #5b616b; }
	@media (max-width: 640px) {
		#rj-form { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; width: min(420px, calc(100vw - 48px)); border-radius: 18px; }
		#rj-form .prefix { display: none; }
		#rj-user { flex: none; font-size: 16px; }
		#rj-form input { border-right: 0 !important; border: 1px solid var(--edge) !important; border-radius: 10px; padding: 13px 14px; font-size: 16px; background: rgba(255,255,255,0.03); width: 100%; box-sizing: border-box; }
		#rj-form button { padding: 13px; border-radius: 10px; font-size: 15px; width: 100%; }
	}
	#rj-swap { margin-top: 18px; font-size: 13px; color: #7d838d; text-align: center; }
	#rj-swap a { color: #ffa028; text-decoration: none; cursor: pointer; }
	#rj-swap a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header id="rj-chrome">
	<svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="var(--amber)" d="M11.6 39.6 L14.4 42.4 L4.7 50.7 L3.3 49.3 Z"/><path fill="var(--amber)" d="M20.6 48.6 L23.4 51.4 L15.7 57.7 L14.3 56.3 Z"/><path fill="var(--amber-deep)" d="M58 6 L12 22 L30 32 Z"/><path fill="var(--amber)" d="M58 6 L30 32 L40 50 Z"/></svg>
	<span class="byline">goattech</span>
</header>

<main id="rj-landing">
	<h1 class="wordmark-big">ram<em>jet</em></h1>
	<p class="tag" id="rj-mode">crew only. sign in.</p>
</main>

<form id="rj-form">
	<input id="rj-user" type="text" name="username" autocomplete="username" placeholder="username" aria-label="Username" autocapitalize="none" required>
	<span class="prefix">//</span>
	<input id="rj-address" type="password" name="password" autocomplete="current-password" placeholder="password" aria-label="Password" required>
	<button type="submit" class="ignite" id="rj-go">unlock&nbsp;&#8594;</button>
</form>

<p id="rj-err" role="alert"></p>
<p id="rj-swap"><a id="rj-swaplink">need an account? sign up</a></p>

<footer id="rj-foot">
	<span id="rj-status" data-mode="idle">gate armed</span>
	<span class="ver">v0.7.4</span>
</footer>

<script src="/rjcrypto.js"></script>
<script>
	const err = document.getElementById("rj-err");
	const form = document.getElementById("rj-form");
	const user = document.getElementById("rj-user");
	const pass = document.getElementById("rj-address");
	const mode = document.getElementById("rj-mode");
	const swaplink = document.getElementById("rj-swaplink");
	let signingUp = false;

	swaplink.addEventListener("click", () => {
		signingUp = !signingUp;
		err.textContent = "";
		mode.textContent = signingUp ? "claim your seat." : "crew only. sign in.";
		swaplink.textContent = signingUp ? "have an account? sign in" : "need an account? sign up";
		document.getElementById("rj-go").innerHTML = signingUp ? "join&nbsp;&#8594;" : "unlock&nbsp;&#8594;";
		user.focus();
	});

	const q = new URLSearchParams(location.search);
	if (q.has("bad")) err.textContent = "wrong password. try again.";
	if (q.has("locked")) err.textContent = "too many tries - gate's locked for 15 minutes.";

	form.addEventListener("submit", async (e) => {
		e.preventDefault();
		err.textContent = "";
		const u = user.value.trim().toLowerCase();
		const p = pass.value;
		if (!u || !p) { err.textContent = "username and password required."; return; }
		const body = "username=" + encodeURIComponent(u) + "&password=" + encodeURIComponent(p);
		try {
			if (signingUp) {
				const res = await fetch("/auth/signup", { method: "POST", headers: { "content-type": "application/x-www-form-urlencoded" }, body });
				const data = await res.json();
				if (!res.ok) { err.textContent = data.error || "signup failed."; return; }
				if (data.pending) { err.textContent = ""; mode.textContent = "in the queue - luke approves new accounts."; return; }
			} else {
				const res = await fetch("/auth/login", { method: "POST", headers: { "content-type": "application/x-www-form-urlencoded" }, body });
				const data = await res.json().catch(() => ({}));
				if (!res.ok) { err.textContent = data.error || "wrong username or password."; return; }
			}
			// key chain: derive from the password, store KEK on-device only
			const okc = await RJCrypto.unlockWithPassword(p);
			if (!okc) { err.textContent = "signed in, but the encryption key would not unlock. tell luke."; return; }
			location.href = "/";
		} catch {
			err.textContent = "network error. try again.";
		}
	});
	user.focus();
</script>

</body>
</html>
