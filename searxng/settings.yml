# ramjet browse search backend
use_default_settings: true
server:
  secret_key: "ultrasecretkey"  # real key comes from data/searxng-secret at runtime
  limiter: false
  image_proxy: true
search:
  safe_search: 0
  suspended_times:
    SearxEngineTooManyRequests: 600
  autocomplete: "duckduckgo"
  formats:
    - html
    - json
ui:
  default_theme: simple
  query_in_title: true
engines:
  - name: google
    disabled: true
  # ddg CAPTCHAs this IP (verified 9/29 direct, via proxy, via searxng) - off until it recovers
  - name: duckduckgo
    disabled: true
  - name: qwant
    disabled: true
