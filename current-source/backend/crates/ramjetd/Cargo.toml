[package]
name = "ramjetd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
rj-crypto = { path = "../rj-crypto" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "stream", "socks"] }
scraper = "0.23"
ego-tree = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
url = "2"
futures = "0.3"
regex = "1"
flate2 = "1"
brotli = "7"
sha2 = "0.10"





aes-gcm = "=0.10.3"

libc = "=0.2.191"

rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"





httpdate = "=1.0.3"

tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.9"

[features]


default = []
qa-hooks = []
